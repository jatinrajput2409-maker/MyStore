spring:
  application:
    name: app-platform
  profiles:
    active: dev
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:appplatform}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:200MB}
      max-request-size: ${MAX_REQUEST_SIZE:210MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# App Platform custom configuration
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}      # 15 min
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    provider: ${STORAGE_PROVIDER:s3}
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-south-1}
    endpoint: ${S3_ENDPOINT:}                # Override for S3-compatible services
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    quarantine-prefix: quarantine/
    files-prefix: files/
    presigned-url-ttl-minutes: ${PRESIGNED_URL_TTL_MINUTES:5}
  security:
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
    upload-rate-limit-per-hour: ${UPLOAD_RATE_LIMIT_PER_HOUR:20}
  download-events:
    ttl-days: ${DOWNLOAD_EVENT_TTL_DAYS:90}
  admin:
    setup-secret: ${ADMIN_SETUP_SECRET}      # Used once to create the first super admin
  files:
    max-apk-size-bytes: ${MAX_APK_SIZE_BYTES:209715200}  # 200 MB
    max-icon-size-bytes: ${MAX_ICON_SIZE_BYTES:5242880}  # 5 MB
    max-screenshot-size-bytes: ${MAX_SCREENSHOT_SIZE_BYTES:10485760} # 10 MB
